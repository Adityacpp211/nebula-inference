{{- $name := "nebula-controlplane" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "nebula.labels" . | nindent 4 }}
# No Kubernetes API access at all (docs/deployment-architecture.md §3).
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nebula.labels" . | nindent 4 }}
    {{- include "nebula.selector" $name | nindent 4 }}
spec:
  replicas: {{ .Values.controlplane.replicas }}
  selector:
    matchLabels: {{- include "nebula.selector" $name | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nebula.labels" . | nindent 8 }}
        {{- include "nebula.selector" $name | nindent 8 }}
      annotations:
        # A changed secret rolls the pods instead of silently doing nothing.
        checksum/secrets: {{ include (print $.Template.BasePath "/namespaces-secrets.yaml") . | sha256sum }}
        {{- include "nebula.scrapeAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      securityContext: {{- include "nebula.podSecurity" . | nindent 8 }}
      terminationGracePeriodSeconds: 60
      {{- if .Values.data.enabled }}
      initContainers:
        # With in-cluster data there is no database at pre-install time for a hook
        # to migrate, so the schema owner migrates before it starts. Idempotent,
        # and serialized by the runner's advisory lock (tested in Phase 1).
        - name: migrate
          image: {{ include "nebula.image" (dict "root" . "name" "migrate") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["up"]
          env:
            - name: NEBULA_DATABASE_URL
              valueFrom: {secretKeyRef: {name: nebula-secrets, key: NEBULA_DATABASE_URL}}
          securityContext: {{- include "nebula.containerSecurity" . | nindent 12 }}
      {{- end }}
      containers:
        - name: controlplane
          image: {{ include "nebula.image" (dict "root" . "name" "controlplane") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports: [{name: http, containerPort: 8082}, {name: metrics, containerPort: {{ .Values.telemetry.metricsPort }}}]
          env:
            {{- include "nebula.commonEnv" . | nindent 12 }}
            - name: NEBULA_HTTP_ADDR
              value: ":8082"
            - name: NEBULA_DEV_SEED
              value: {{ .Values.controlplane.devSeed | quote }}
            {{- if and .Values.controlplane.devSeed .Values.controlplane.devSeedKey }}
            - name: NEBULA_DEV_SEED_KEY
              value: {{ .Values.controlplane.devSeedKey | quote }}
            {{- end }}
            - name: NEBULA_DEV_MOCK_RUNTIME
              value: {{ ne .Values.env "production" | quote }}
            {{- if and .Values.data.enabled (ne .Values.env "production") }}
            # The in-cluster development store starts empty; production buckets are
            # created by the operator.
            - name: NEBULA_DEV_CREATE_BUCKET
              value: "true"
            {{- end }}
            - name: NEBULA_ARTIFACT_STORE
              value: {{ .Values.artifact.store | quote }}
            - name: NEBULA_ARTIFACT_S3_ENDPOINT
              value: {{ .Values.artifact.endpoint | quote }}
            - name: NEBULA_ARTIFACT_S3_PUBLIC_ENDPOINT
              value: {{ .Values.artifact.publicEndpoint | quote }}
            - name: NEBULA_ARTIFACT_S3_BUCKET
              value: {{ .Values.artifact.bucket | quote }}
            - name: NEBULA_ARTIFACT_S3_REGION
              value: {{ .Values.artifact.region | quote }}
            - name: NEBULA_ARTIFACT_S3_USE_TLS
              value: {{ .Values.artifact.useTLS | quote }}
            {{- range $k := list "NEBULA_AUTH_KEY_PEPPER" "NEBULA_INTERNAL_AUTH_SECRET" "NEBULA_DATABASE_URL" "NEBULA_ARTIFACT_S3_ACCESS_KEY" "NEBULA_ARTIFACT_S3_SECRET_KEY" }}
            - name: {{ $k }}
              valueFrom: {secretKeyRef: {name: nebula-secrets, key: {{ $k }}}}
            {{- end }}
          {{- include "nebula.probes" . | nindent 10 }}
          lifecycle:
            preStop: {sleep: {seconds: 5}}
          resources: {{- toYaml .Values.controlplane.resources | nindent 12 }}
          securityContext: {{- include "nebula.containerSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "nebula.labels" . | nindent 4 }}
spec:
  selector: {{- include "nebula.selector" $name | nindent 4 }}
  ports: [{name: http, port: 8082, targetPort: http}]
