{{- if .Values.namespaces.create }}
{{- range $ns := list .Values.namespaces.workloads .Values.namespaces.data }}
{{- if or (ne $ns $.Values.namespaces.data) $.Values.data.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "nebula.labels" $ | nindent 4 }}
    # Warn, not enforce: worker pods mount the node's model cache as a hostPath,
    # which every Pod Security level above "privileged" forbids. Every NEBULA pod
    # otherwise meets "restricted" (non-root, no privilege escalation, all
    # capabilities dropped, RuntimeDefault seccomp), and the warning makes any
    # regression visible. A per-node PVC cache removes the exception.
    pod-security.kubernetes.io/warn: restricted
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: nebula-secrets
  namespace: {{ .Release.Namespace }}
  labels: {{- include "nebula.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEBULA_AUTH_KEY_PEPPER: {{ required "secrets.keyPepper is required" .Values.secrets.keyPepper | quote }}
  NEBULA_INTERNAL_AUTH_SECRET: {{ required "secrets.internalAuthSecret is required" .Values.secrets.internalAuthSecret | quote }}
  NEBULA_DATABASE_URL: {{ required "secrets.databaseURL is required" .Values.secrets.databaseURL | quote }}
  NEBULA_CONTROLLER_DATABASE_URL: {{ required "secrets.controllerDatabaseURL is required" .Values.secrets.controllerDatabaseURL | quote }}
  NEBULA_REDIS_URL: {{ required "secrets.redisURL is required" .Values.secrets.redisURL | quote }}
  NEBULA_ARTIFACT_S3_ACCESS_KEY: {{ required "secrets.artifactAccessKey is required" .Values.secrets.artifactAccessKey | quote }}
  NEBULA_ARTIFACT_S3_SECRET_KEY: {{ required "secrets.artifactSecretKey is required" .Values.secrets.artifactSecretKey | quote }}
---
# The artifact puller's credentials, in the workload namespace. The controller
# references this Secret by name and has no permission to read it
# (docs/deployment-architecture.md §3).
apiVersion: v1
kind: Secret
metadata:
  name: nebula-artifact-store
  namespace: {{ .Values.namespaces.workloads }}
  labels: {{- include "nebula.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEBULA_ARTIFACT_S3_ENDPOINT: {{ required "artifact.endpoint is required" .Values.artifact.endpoint | quote }}
  NEBULA_ARTIFACT_S3_REGION: {{ .Values.artifact.region | quote }}
  NEBULA_ARTIFACT_S3_USE_TLS: {{ .Values.artifact.useTLS | quote }}
  NEBULA_ARTIFACT_S3_ACCESS_KEY: {{ .Values.secrets.artifactAccessKey | quote }}
  NEBULA_ARTIFACT_S3_SECRET_KEY: {{ .Values.secrets.artifactSecretKey | quote }}
