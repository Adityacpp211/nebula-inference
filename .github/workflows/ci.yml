name: CI

# The phase gate, run by a machine: build, lint, unit tests, and the checks that
# cannot be faked — migrations up/down/up, row-level security, immutability
# triggers, deferred constraints, and (Phase 3) the inference worker streaming real
# tokens out of a real model through a real engine process.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"
  PYTHON_VERSION: "3.11"
  # The engine is pinned to a tag, not master. Which tokens a GGUF produces is a
  # property of a specific engine build, so an engine tracking master would make an
  # upstream sampling change look like a model regression. Keep in step with
  # LLAMA_CPP_REF in deploy/docker/Dockerfile.worker.
  LLAMA_CPP_REF: "b11157"

jobs:
  build:
    name: build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # so `git describe` can stamp a version

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: verify dependencies
        run: |
          go mod download
          go mod verify

      - name: formatting
        run: make fmt-check

      - name: vet
        run: make vet

      - name: build
        run: make build

      - name: unit tests (race detector, coverage)
        run: make test

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1
          args: --timeout=5m

  integration:
    name: integration tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nebula
          POSTGRES_PASSWORD: nebula
          POSTGRES_DB: nebula
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nebula"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: prepare the test database
        env:
          PGPASSWORD: nebula
        run: |
          # The suite creates and drops a database per test, so the role needs
          # CREATEDB. Isolation per test is what keeps them parallel-safe.
          psql -h 127.0.0.1 -U nebula -d nebula -c "ALTER ROLE nebula CREATEDB;"
          psql -h 127.0.0.1 -U nebula -d nebula -c "SELECT version();"

      - name: integration tests
        env:
          NEBULA_TEST_DATABASE_URL: postgres://nebula:nebula@127.0.0.1:5432/nebula?sslmode=disable
        run: go test -race -count=1 ./tests/integration/... ./services/controlplane/tests/...

  e2e-gateway:
    name: gateway end to end (OpenAI SDK against a live stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install the worker and the SDK the test drives
        run: python -m pip install -e workers/inference openai httpx pytest

      # The Phase 4 exit criterion: openai.OpenAI(base_url=...).chat.completions
      # .create(stream=True) streams tokens from a worker through the gateway.
      - name: e2e
        env:
          PY: python
        run: ./scripts/e2e-gateway.sh

  helm:
    name: helm chart (lint, render dev and production values)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: lint and render
        run: make helm-check

  e2e-kind:
    name: kind end to end (controller, RBAC, network policy, artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      # dev-up creates the cluster from deploy/kind/cluster.yaml, builds every image,
      # loads them into kind and installs the chart; the demo then walks the Phase 5
      # exit criteria against it.
      - name: bring NEBULA up
        run: ./scripts/dev-up.sh
      - name: phase 5 demo
        run: python3 tests/e2e/kind/phase5_demo.py
      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl get all -A
          kubectl -n nebula-system logs deploy/nebula-controller --tail=200 || true
          kubectl -n nebula-system logs deploy/nebula-controlplane --tail=200 || true

  migrations:
    name: migration cycle (up, down, up)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nebula
          POSTGRES_PASSWORD: nebula
          POSTGRES_DB: nebula
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nebula"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: build the migrator
        run: make build

      # A down migration that has never run is not a down migration.
      - name: up, down to empty, up again
        env:
          NEBULA_DATABASE_URL: postgres://nebula:nebula@127.0.0.1:5432/nebula?sslmode=disable
        run: |
          set -euo pipefail
          ./bin/nebula-migrate up
          ./bin/nebula-migrate status
          ./bin/nebula-migrate validate
          ./bin/nebula-migrate down 99
          ./bin/nebula-migrate up
          ./bin/nebula-migrate version

      # A down migration that leaves debris behind would collide with the next up.
      - name: assert no tables survive a full teardown
        env:
          PGPASSWORD: nebula
          NEBULA_DATABASE_URL: postgres://nebula:nebula@127.0.0.1:5432/nebula?sslmode=disable
        run: |
          set -euo pipefail
          ./bin/nebula-migrate down 99
          remaining=$(psql -h 127.0.0.1 -U nebula -d nebula -tAc \
            "SELECT count(*) FROM information_schema.tables
              WHERE table_schema='public' AND table_name <> 'schema_migrations'")
          if [ "$remaining" != "0" ]; then
            echo "$remaining table(s) survived the down migrations"
            psql -h 127.0.0.1 -U nebula -d nebula -c "\dt"
            exit 1
          fi
          echo "schema is clean after teardown"

  worker:
    name: inference worker (lint, types, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: workers/inference/pyproject.toml

      - name: install the worker and its development extra
        run: make worker-install

      - name: lint and types
        run: make worker-lint

      - name: unit tests
        run: make worker-test

  worker-integration:
    name: inference worker (real engine, real model)
    runs-on: ubuntu-latest

    # This is the Phase 3 exit criterion, so it is a job rather than a manual step:
    # client -> worker -> model -> streamed tokens, asserted on the content of real
    # output. The suite also asserts the runtime is named llamacpp, so a silent
    # fallback to the declared stub fails here instead of passing.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: workers/inference/pyproject.toml

      - name: cache the engine build
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/nebula/engine
          # Keyed by the pinned ref, so bumping the engine rebuilds and anything
          # else reuses. A cache key without the ref would serve the old engine
          # after a bump, which is the failure this pin exists to prevent.
          key: llamacpp-${{ env.LLAMA_CPP_REF }}-${{ runner.os }}

      - name: build llama-server
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$LLAMA_CPP_REF" \
            https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -B /tmp/llama.cpp/build -S /tmp/llama.cpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF
          # llama-tokenize as well as llama-server: the fixture trains against the
          # engine's own tokenizer rather than a reimplementation of it, which is
          # what keeps a model that loads cleanly from emitting confident garbage.
          cmake --build /tmp/llama.cpp/build --config Release -j "$(nproc)" \
            --target llama-server llama-tokenize
          mkdir -p ~/.cache/nebula/engine
          cp /tmp/llama.cpp/build/bin/llama-server \
             /tmp/llama.cpp/build/bin/llama-tokenize ~/.cache/nebula/engine/
          cp -a /tmp/llama.cpp/build/bin/*.so* ~/.cache/nebula/engine/

      - name: install the worker and its development extra
        run: make worker-install

      - name: train the fixture model
        run: |
          set -euo pipefail
          # ggml's backends are loaded by name from the library path, and the
          # binaries were copied away from their build tree.
          export LD_LIBRARY_PATH="$HOME/.cache/nebula/engine:${LD_LIBRARY_PATH:-}"
          make worker-model NEBULA_LLAMA_SERVER_BIN="$HOME/.cache/nebula/engine/llama-server"

      - name: integration tests
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$HOME/.cache/nebula/engine:${LD_LIBRARY_PATH:-}"
          make worker-test-integration \
            NEBULA_LLAMA_SERVER_BIN="$HOME/.cache/nebula/engine/llama-server"

  docker:
    name: container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: build controlplane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.controlplane
          push: false
          tags: nebula/controlplane:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.gateway
          push: false
          tags: nebula/gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.controller
          push: false
          tags: nebula/controller:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build artifact-puller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.puller
          push: false
          tags: nebula/artifact-puller:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.migrate
          push: false
          tags: nebula/migrate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build worker image (mock)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.worker
          target: mock
          push: false
          # Loaded into the daemon so the assertion below can run against it.
          load: true
          tags: nebula/worker-mock:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Compiles llama.cpp, so it is the slowest job here. It stays in CI anyway:
      # the image's final step runs `llama-server --version`, which is what turns a
      # missing shared object into a failed build rather than a failed first
      # request in someone's cluster.
      - name: build worker image (llama.cpp)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.worker
          target: llamacpp
          build-args: |
            LLAMA_CPP_REF=${{ env.LLAMA_CPP_REF }}
          push: false
          tags: nebula/worker-llamacpp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: the mock image must contain no engine
        run: |
          set -euo pipefail
          # The declared stub is kept out of production by three independent
          # refusals; this asserts the third one, which is the only one visible
          # from outside the process.
          if docker run --rm --entrypoint sh nebula/worker-mock:ci \
               -c 'command -v llama-server' 2>/dev/null; then
            echo "the mock worker image contains an engine binary"
            exit 1
          fi
          echo "mock image carries no engine, as intended"
