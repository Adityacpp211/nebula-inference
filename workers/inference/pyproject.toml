# Declared explicitly rather than relying on pip's legacy fallback: the worker is
# installed as a package in its container image, and an implicit build backend is a
# build that behaves differently on a different pip.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nebula-inference-worker"
version = "0.3.0"
description = "NEBULA's inference worker: the InferenceRuntime abstraction and its adapters."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pydantic>=2.6",
    # Heartbeats to the gateway's router. Imported only when NEBULA_NATS_URL is set.
    "nats-py>=2.6",
]

[project.optional-dependencies]
# Kept out of the runtime image: the fixture generator is a development tool, and a
# worker image has no business carrying a training framework.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "gguf>=0.10",
    "torch>=2.2",
]

[project.scripts]
nebula-inference-worker = "nebula_worker.main:main"

# Only the worker package ships. tests/ and tools/ are development material: the
# fixture generator imports torch, which must never be a runtime dependency.
[tool.setuptools]
packages = ["nebula_worker", "nebula_worker.runtimes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests declare themselves so a developer can run the fast suite alone.
markers = [
    "integration: needs a real engine binary and a real model artifact",
]
# Our own deprecations are errors. The one exception is scoped to a third-party
# module we do not control and do not use: uvicorn's optional extras import
# websockets.legacy at startup, and the worker serves no websockets.
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",   # asserts are how invariants are stated in this codebase
    "PT011",  # pytest.raises without a match is fine for typed errors
    # The runtime error classes are named exactly as docs/api.md §7 names them —
    # ArtifactMissing, ChecksumMismatch, InsufficientMemory, UnsupportedQuantization.
    # Renaming them to ...Error would make the code disagree with the published
    # contract, which is worse than a naming convention.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# Tests poll for observable conditions ("has the slot been released yet?"), which is
# what ASYNC110 objects to; an Event would require the code under test to expose one
# purely for the test's benefit. They also stat files and write compound assertions,
# both of which read better than the alternatives here.
"tests/*" = ["S", "B008", "ASYNC110", "ASYNC240", "PT018"]
"tools/*" = ["S", "ASYNC110"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
